<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/static/style.css">

    <title>Project-1-message</title>
</head>

<body class="messaging">

    <div class="dashboard-container">

        <h2 class="page-title">Student Records</h2>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>

            <input
                type="text"
                placeholder="Search Student"
                class="search-field">

            <button class="search-btn" type="submit">
                Enter
            </button>
        </div>

        <div class="table-container">
            <table class="student-table">

                <tr>
                    <th>Student Name</th>
                    <th>Age</th>
                    <th>Class</th>
                    <th>Parent Name</th>
                    <th>Parent Contact</th>
                </tr>

                {% for student in students %}
                <tr>
                    <td>{{ student.studentname }}</td>
                    <td>{{ student.studentage }}</td>
                    <td>{{ student.studentclass }}</td>
                    <td>{{ student.parentname }}</td>
                    <td>{{ student.parentcontact }}</td>
                </tr>
                {% endfor %}

            </table>
        </div>

        <div class="message-section">

            <div class="section-header">
                <i class="fa-solid fa-mobile mobile-icon"></i>
                <h3 class="message-title">Send Message</h3>
            </div>

            <label class="message-label" for="msgtext">
                Message:
            </label>

            <textarea
                id="msgtext"
                class="message-box"
                placeholder="Type your message here..."
                rows="9"></textarea>

            <button class="send-btn">
                <i class="fa-solid fa-paper-plane"></i>
                Send Message
            </button>

        </div>

        <div class="action-buttons">

            <button class="call-btn">
                <i class="fa-solid fa-phone"></i>
                Call
            </button>

            <button class="call-all-btn">
                <i class="fa-solid fa-phone-flip"></i>
                Call All
            </button>

        </div>

    </div>

</body>
</html>
