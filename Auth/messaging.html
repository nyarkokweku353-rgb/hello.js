<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Project-1-message</title>
</head>
<body>
    <h2>Student Records</h2>
    <div>
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" placeholder="search" class="search-field">
        <button name="submit">Enter</button><br>
    </div>
    <table border="1">
        <tr>
            <th>Student Name</th>
            <th>Age</th>
            <th>Class</th>
            <th>Parent Name</th>
            <th>Parent Contact</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.studentname }}</td>
            <td>{{ student.studentage }}</td>
            <td>{{ student.studentclass }}</td>
            <td>{{ student.parentname }}</td>
            <td>{{ student.parentcontact }}</td>
        </tr>
        {% endfor %}
    </table><br>
    <i class="fa-solid fa-mobile"></i>
    <label for="msg">Message:</label><br>
    <textarea id="msgtext" placeholder="Type your message here . . ." rows="9"></textarea>
    <button>Send Message</button><br>
    <i class="fa-solid fa-phone">Call</i><br>
    <i class="fa-solid fa-phone-flip">Call All</i>
</body>
</html>
