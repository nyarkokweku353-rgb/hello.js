<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/static/style.css">

    <title>Project-1 Data</title>
</head>
<body class="data">

    <div class="data-container">

        <h1 class="data-title">STUDENT DATA</h1>

        <div class="action-bar">

            <button class="action-btn add-btn">
                <i class="fa-solid fa-plus"></i>
                Add
            </button>

            <button class="action-btn remove-btn">
                <i class="fa-solid fa-minus"></i>
                Remove All
            </button>

            <button class="action-btn save-btn">
                <i class="fa-solid fa-floppy-disk"></i>
                Save Changes
            </button>

        </div>

        <form action="/data" method="post" class="student-form">

            <div class="form-group">
                <label for="studentname">Student Full Name</label>
                <input
                    type="text"
                    id="studentname"
                    name="studentname"
                    placeholder="Student Full Name...">
            </div>

            <div class="form-group">
                <label for="studentage">Age</label>
                <input
                    type="number"
                    id="studentage"
                    name="studentage"
                    placeholder="Age...">
            </div>

            <div class="form-group">
                <label for="studentclass">Class/Form</label>
                <input
                    type="number"
                    id="studentclass"
                    name="studentclass"
                    placeholder="Class/Form...">
            </div>

            <div class="form-group">
                <label for="parentname">
                    Name of Guardian or Parent
                </label>
                <input
                    type="text"
                    id="parentname"
                    name="parentname"
                    placeholder="Guardian or Parent Name...">
            </div>

            <div class="form-group">
                <label for="parentcontact">
                    Parent or Guardian Contact
                </label>
                <input
                    type="number"
                    id="parentcontact"
                    name="parentcontact"
                    placeholder="Parent Contact...">
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i>
                Submit
            </button>

        </form>

    </div>

</body>
</html>
